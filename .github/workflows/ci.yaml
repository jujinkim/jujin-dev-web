name: Validate Quartz

on:
  push:
    branches: [v5, main]
  pull_request:
    branches: [v5, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and index local plugins
        run: npm run install-plugins
      - name: Check types and formatting
        run: npm run check
      - name: Test Quartz
        run: npm test
      - name: Build site
        run: npx quartz build
